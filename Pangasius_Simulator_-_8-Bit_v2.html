<style>

<script>
const $=i=>document.getElementById(i),cv=$('c'),ctx=cv.getContext('2d'),rnd=(a,b)=>a+Math.random()*(b-a);

const LV=[{goal:5,pred:0,ps:0,bar:0,boat:0,tut:1},{goal:6,pred:1,ps:1.1,bar:0,boat:0},{goal:8,pred:2,ps:1.3,bar:5500,boat:0},{goal:10,pred:2,ps:1.5,bar:4500,boat:6500},{goal:12,pred:3,ps:1.7,bar:4000,boat:5000},{goal:15,pred:4,ps:1.9,bar:3200,boat:4200}];

// ---------- MUSIC ----------
const MN={C:0,D:2,E:4,F:5,G:7,A:9,B:11},MID=s=>{const m=/^([A-G])([#b]?)(\d)$/.exec(s);return 12*(+m[3]+1)+MN[m[1]]+(m[2]=='#'?1:m[2]=='b'?-1:0)},MF=m=>440*Math.pow(2,(m-69)/12);
const SONGS={
menu:{sp:.24,lw:'square',lv:.03,bw:'triangle',bv:.09,det:0,bp:'0 - 7 - 0 - 12 7',D:'k-h-s-h-',R:'C3 A2 F2 G2 C3 A2 F2 G2',
L:['E5 - G5 - C6 - G5 E5','E5 - A5 - C6 - A5 E5','F5 - A5 - C6 - A5 F5','D5 - G5 - B5 - G5 D5','C6 B5 C6 - G5 - E5 -','A5 G5 A5 - E5 - C5 -','A5 G5 F5 E5 F5 G5 A5 -','B5 A5 G5 - D5 E5 G5 -']},
tut:{sp:.2,lw:'triangle',lv:.07,bw:'sine',bv:.1,det:0,bp:'0 - - - 7 - - -',D:'k---h---',R:'G2 E2 C3 D3 G2 E2 C3 D3',
L:['B4 D5 G5 D5 B4 D5 G5 -','G4 B4 E5 B4 G4 B4 E5 -','G4 C5 E5 C5 G4 C5 E5 -','A4 D5 F#5 D5 A4 D5 F#5 -','G5 F#5 G5 B5 A5 G5 D5 -','E5 D5 E5 G5 F#5 E5 B4 -','C5 D5 E5 G5 E5 D5 C5 -','D5 E5 F#5 A5 G5 F#5 D5 -']},
lvl:{sp:.15,lw:'square',lv:.03,bw:'square',bv:.035,det:0,bp:'0 - 0 12 0 - 7 12',D:'khshkhsh',R:'A2 F2 C3 G2 A2 F2 G2 E2',
L:['A5 C6 E6 C6 A5 C6 E6 -','A5 C6 F6 C6 A5 C6 F6 -','G5 C6 E6 C6 G5 C6 E6 -','G5 B5 D6 B5 G5 B5 D6 -','E6 - D6 C6 B5 - C6 D6','C6 - A5 - F5 A5 C6 -','B5 - D6 - G6 - D6 B5','G#5 B5 E6 B5 G#5 B5 E6 -']},
death:{sp:.24,lw:'sawtooth',lv:.025,bw:'sawtooth',bv:.04,det:18,bp:'0 _ _ _ _ _ _ _',D:'kk------',R:'D2 D2 A#1 A1 D2 D2 A#1 A1',
L:['D5 _ _ _ G#5 _ _ _','D5 _ F5 _ E5 _ _ _','A#4 _ _ _ E5 _ _ _','A4 _ C#5 _ _ _ _ _','D5 _ _ _ G#5 _ A5 _','F5 _ E5 _ D5 _ _ _','A#4 _ A4 _ G#4 _ _ _','A4 _ _ _ _ _ _ _']}};
for(const k in SONGS){const s=SONGS[k];s.l=s.L.join(' ').split(' ');s.b=[];s.R.split(' ').forEach(r=>s.bp.split(' ').forEach(t=>s.b.push(t=='-'||t=='_'?t:MID(r)+(+t))))}
let mus=null,nbuf;
function music(n,l){if(mus&&mus.n==n&&mus.l==l)return;stopMus();mus=n?{n,l,i:0,t:0,sp:SONGS[n].sp-(n=='lvl'?Math.max(0,l-1)*.008:0)}:null}
function stopMus(){if(mus&&mus.o){const o=mus.o;try{o.gain.setTargetAtTime(0,ac.currentTime,.05);setTimeout(()=>{try{o.disconnect()}catch(e){}},600)}catch(e){}}mus=null}
function mTone(t,f,d,type,v,out,det){for(const c of det?[0,det]:[0]){const o=ac.createOscillator(),gn=ac.createGain();o.type=type;o.frequency.value=f;o.detune.value=c;gn.gain.setValueAtTime(.0001,t);gn.gain.linearRampToValueAtTime(v,t+.01);gn.gain.setValueAtTime(v,t+Math.max(.011,d-.04));gn.gain.linearRampToValueAtTime(.0001,t+d);o.connect(gn);gn.connect(out);o.start(t);o.stop(t+d+.02)}}
function mDrum(c,t,out){if(c=='-')return;if(c=='k'){const o=ac.createOscillator(),gn=ac.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(40,t+.12);gn.gain.setValueAtTime(.12,t);gn.gain.exponentialRampToValueAtTime(.001,t+.14);o.connect(gn);gn.connect(out);o.start(t);o.stop(t+.16);return}
nbuf=nbuf||(()=>{const b=ac.createBuffer(1,ac.sampleRate,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return b})();
const s=ac.createBufferSource(),gn=ac.createGain(),f=ac.createBiquadFilter(),l=c=='h'?.03:.1;f.type='highpass';f.frequency.value=c=='h'?7000:1500;s.buffer=nbuf;gn.gain.setValueAtTime(c=='h'?.03:.06,t);gn.gain.exponentialRampToValueAtTime(.001,t+l);s.connect(f);f.connect(gn);gn.connect(out);s.start(t);s.stop(t+l+.02)}
setInterval(()=>{if(!mus||!save.snd)return;try{ac=ac||new AudioContext();if(ac.state!='running')return;
if(!mus.o){mus.o=ac.createGain();mus.o.connect(ac.destination);mus.t=ac.currentTime+.05}
const s=SONGS[mus.n];if(mus.t<ac.currentTime)mus.t=ac.currentTime+.02;
while(mus.t<ac.currentTime+.15){const i=mus.i%64,t=mus.t,sp=mus.sp,ln=a=>{let n=1;while(a[(i+n)%64]=='_'&&n<64)n++;return n};
let k=s.l[i];if(k!='-'&&k!='_')mTone(t,MF(MID(k)),sp*ln(s.l)*.9,s.lw,s.lv,mus.o,s.det);
k=s.b[i];if(k!='-'&&k!='_')mTone(t,MF(k),sp*ln(s.b)*.9,s.bw,s.bv,mus.o,0);
mDrum(s.D[i%8],t,mus.o);mus.t+=sp;mus.i++}}catch(e){}},30);
const wake=()=>{try{ac=ac||new AudioContext();if(ac.state=='suspended')ac.resume()}catch(e){}};
['pointerdown','keydown','touchstart'].forEach(e=>addEventListener(e,wake));

// ---------- /MUSIC ----------
const pad=n=>String(n||0).padStart(6,'0');const R=(x,y,w,h,c)=>{ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),w,h)};
// procedural pixel-art fish, 2 tail frames
function mkFish(L,Hh,p,o={}){return[0,1,2,3].map(fr=>{const c=document.createElement('canvas');c.width=L;c.height=Hh;const g=c.getContext('2d'),px=(x,y,k)=>{g.fillStyle=k;g.fillRect(Math.round(x),Math.round(y),1,1)};

for(let y=0;y<Hh;y++)for(let x=0;x<L;x++){
if(x<tw&&x<cx-rx+3){const t=x/tw,hh=Hh*.1+(1-t)*Hh*.32,s=[-1,0,1,0][fr]*(1-t)*2.4;if(Math.abs(y-cy-s)<hh)px(x,y,p.f)}
const fx=(x-(cx-rx*.1))/(rx*.4);if(Math.abs(fx)<1&&y<cy-ry*.9&&y>cy-ry*.9-(1-Math.abs(fx))*Hh*.18)px(x,y,p.f);
const dx=(x-cx)/rx,dy=(y-cy)/ry,d=dx*dx+dy*dy;if(d<=1)px(x,y,d>.7?p.o:dy<-.35?p.a:dy<.35?p.b:p.c)}
for(let i=0;i<4;i++)px(cx+i,cy+ry*.55,p.f);if(o.wing){const am=fr%2?.45:.75;for(let i=0;i<10;i++){const wy=cy-ry-(i<5?i:9-i)*am;px(cx-6+i,wy,p.f);px(cx-6+i,wy+1,p.a)}}
const ex=cx+rx*.5,ey=cy-ry*.45;px(ex,ey,'#fff');px(ex+1,ey,'#fff');px(ex,ey+1,'#fff');px(ex+1,ey+1,'#000');
if(o.teeth){for(let x=cx+rx*.45;x<cx+rx*.95;x+=2)px(x,cy+ry*.2,'#fff');px(ex-1,ey-2,p.o);px(ex,ey-2,p.o);px(ex+1,ey-1,p.o)}
if(o.barb){for(let i=1;i<4;i++){px(cx+rx+i,cy+ry*.3+(i>1?1:0),'#e6edf5');px(cx+rx*.7+i,cy+ry+i*.7,'#e6edf5')}}
return c})}
